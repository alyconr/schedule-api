services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sena_horarios}
      POSTGRES_USER: ${POSTGRES_USER:-sena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_strong_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sena_user} -d ${POSTGRES_DB:-sena_horarios}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-GESTION DE HORARIOS CGMLTI API}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sena_user}:${POSTGRES_PASSWORD:-replace_with_strong_password}@postgres:5432/${POSTGRES_DB:-sena_horarios}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-horarios.datasena.com,localhost,127.0.0.1,backend,testserver}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-dev-secret-do-not-use-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Sena1234}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrador}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  postgres_data:
